<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rich Point Discovery</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <h1>Rich Point Discovery</h1>
            <div class="input-row">
                <input type="text" id="url-input" placeholder="Paste a YouTube URL..." />
                <button id="analyze-btn" onclick="startAnalysis()">Analyze</button>
            </div>
        </div>
    </div>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>History</h3>
            </div>
            <div class="sidebar-list" id="sidebar-list">
                <p class="sidebar-empty">No videos analyzed yet</p>
            </div>
        </aside>

        <main class="main-content">
            <div id="status-section" class="status-section hidden">
                <div class="status-bar">
                    <div class="spinner"></div>
                    <span id="status-text">Starting...</span>
                </div>
                <div class="progress-steps">
                    <div class="step" id="step-fetch"><div class="step-dot"></div><span>Transcript</span></div>
                    <div class="step" id="step-split"><div class="step-dot"></div><span>A1 Split</span></div>
                    <div class="step" id="step-scan"><div class="step-dot"></div><span>B1 Scan</span></div>
                    <div class="step" id="step-l1"><div class="step-dot"></div><span>B2 Level 1</span></div>
                    <div class="step" id="step-l2"><div class="step-dot"></div><span>B3 Level 2</span></div>
                    <div class="step" id="step-topics"><div class="step-dot"></div><span>Topics</span></div>
                </div>
            </div>

            <div id="error-section" class="error-section hidden">
                <p id="error-text"></p>
            </div>

            <div id="results-section" class="results-section hidden">
                <div class="video-url-bar" id="video-url-bar"></div>

                <!-- Tab navigation -->
                <div class="tab-bar">
                    <button class="tab active" data-tab="tab-overview" onclick="switchTab(this)">Overview</button>
                    <button class="tab" data-tab="tab-richpoints" onclick="switchTab(this)">Rich Points</button>
                    <button class="tab" data-tab="tab-topics" onclick="switchTab(this)">Cultural Topics</button>
                    <button class="tab" data-tab="tab-transcript" onclick="switchTab(this)">Transcript</button>
                </div>

                <!-- Tab: Overview -->
                <div class="tab-content active" id="tab-overview">
                    <div class="overview-grid" id="overview-grid"></div>
                </div>

                <!-- Tab: Rich Points -->
                <div class="tab-content" id="tab-richpoints">
                    <div class="results-header">
                        <h2>Rich Points</h2>
                        <div class="results-meta" id="results-meta"></div>
                    </div>
                    <div id="results-list"></div>
                </div>

                <!-- Tab: Cultural Topics (D1 + D2) -->
                <div class="tab-content" id="tab-topics">
                    <div class="results-header">
                        <h2>Cultural Topics</h2>
                        <div class="results-meta" id="topics-meta"></div>
                    </div>
                    <div id="topics-list"></div>
                </div>

                <!-- Tab: Transcript -->
                <div class="tab-content" id="tab-transcript">
                    <div class="transcript-header">
                        <h2>Transcript</h2>
                        <div class="transcript-meta" id="transcript-meta"></div>
                    </div>
                    <div class="transcript-body" id="transcript-body"></div>
                </div>
            </div>

            <div id="welcome-section" class="welcome-section">
                <p>Paste a YouTube URL above to discover cultural rich points and cultural topics.</p>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
